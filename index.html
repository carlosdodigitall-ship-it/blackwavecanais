    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "BLACKWAVE",
          "url": "https://blackwave.digital",
          "logo": "https://blackwave.digital/favicon.svg",
          "description": "Entretenimento digital com uma experiência simples e moderna."
        },
        {
          "@type": "Product",
          "name": "Plano BLACKWAVE",
          "description": "Entretenimento digital sem complicação nos planos mensal e anual.",
          "offers": [
            {
              "@type": "Offer",
              "name": "Plano Mensal BLACKWAVE",
              "price": "25.00",
              "priceCurrency": "BRL",
              "availability": "https://schema.org/InStock"
            },
            {
              "@type": "Offer",
              "name": "Plano Anual BLACKWAVE",
              "price": "100.00",
              "priceCurrency": "BRL",
              "availability": "https://schema.org/InStock"
            }
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "O que é a BLACKWAVE?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A BLACKWAVE é uma experiência de entretenimento digital apresentada de forma simples e moderna."
              }
            },
            {
              "@type": "Question",
              "name": "Quais são os planos?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Atualmente estão disponíveis os planos mensal de R$ 25 e anual de R$ 100."
              }
            },
            {
              "@type": "Question",
              "name": "Como faço para contratar?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Escolha o plano desejado e fale com nossa equipe pelo WhatsApp."
              }
            },
            {
              "@type": "Question",
              "name": "Como funciona a ativação?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Após a contratação, nossa equipe fornece as orientações necessárias para começar."
              }
            },
            {
              "@type": "Question",
              "name": "Posso tirar dúvidas antes de contratar?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. Você pode falar diretamente com nossa equipe pelo WhatsApp."
              }
            },
            {
              "@type": "Question",
              "name": "Como entro em contato?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Utilize qualquer botão de WhatsApp disponível na página."
              }
            }
          ]
        }
      ]
    }
